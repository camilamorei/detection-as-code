title: Kerberoasting - RC4 Service Ticket Requested
id: 77cd9cd4-8705-4c74-a3f4-0b36752b53d4
status: experimental
description: Detects a Kerberos service ticket requested with RC4 encryption, a sign of Kerberoasting.
references:
  - https://attack.mitre.org/techniques/T1558/003/
author: camilamorei
date: 2026-11-05
tags:
  - attack.credential-access
  - attack.t1558.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    TicketEncryptionType: '0x17'
    Status: '0x0'
  filter_machine_accounts:
    ServiceName|endswith: '$'
  filter_krbtgt:
    ServiceName: 'krbtgt'
  condition: selection and not 1 of filter_*
falsepositives:
  - Legacy applications or devices that only support RC4 encryption
level: medium

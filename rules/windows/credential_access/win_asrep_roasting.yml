title: AS-REP Roasting - TGT Requested Without Pre-Authentication
id: d37c4305-3a9f-4773-89f6-f129d30a10cf
status: experimental
description: Detects a Kerberos TGT issued with RC4 encryption for an account that does not require pre-authentication, a sign of AS-REP Roasting.
references:
  - https://attack.mitre.org/techniques/T1558/004/
author: camilamorei
date: 2026-11-05
tags:
  - attack.credential-access
  - attack.t1558.004
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4768
    PreAuthType: 0
    TicketEncryptionType: '0x17'
    Status: '0x0'
  condition: selection
falsepositives:
  - Accounts intentionally configured with "Do not require Kerberos preauthentication"
level: high
